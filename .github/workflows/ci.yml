name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Only for the tests of the "connect your own PostgreSQL" feature.
      # Codexa's own database is Cloudflare D1 (local D1 in tests).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codexa
          POSTGRES_PASSWORD: codexa
          POSTGRES_DB: codexa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codexa" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://codexa:codexa@localhost:5432/codexa_test
      SESSION_SECRET: ci-session-secret-ci-session-secret
      ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
