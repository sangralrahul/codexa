name: Deploy to Cloudflare

# Deploys the website whenever main changes (and on demand from the Actions tab). It does what
# `npm run cf:deploy` does on a developer's PC: builds the runner container image with Docker,
# builds the Worker with OpenNext, deploys, then applies any new D1 migrations. Secrets stored on
# the Worker (API keys, SESSION_SECRET, APP_URL…) are untouched by a deploy.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts, Workers R2 Storage, D1, Containers,
#                          Workers Routes and DNS edit permissions on the account/zone
#   CLOUDFLARE_ACCOUNT_ID  the account id (in the dashboard URL)

on:
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/live-check.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Build and deploy (container image, Worker, routes)
        run: npm run cf:deploy

      - name: Apply database migrations
        run: npm run db:migrate:remote

      - name: Check the site answers
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://codexa.creditvault.tech/login || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::The site did not answer with 200 after the deploy."
          exit 1
