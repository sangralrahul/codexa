name: Live check

# Manual diagnostics: fetches the live app and a preview address from a GitHub runner and prints
# status, headers and the start of the body. Run from the Actions tab with a preview token.

on:
  workflow_dispatch:
    inputs:
      token:
        description: Preview token (the part before -preview.creditvault.tech)
        required: false
        default: zzzzzzzzzzzzzzzzzzzzzzzz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          TOKEN: ${{ inputs.token }}
        run: |
          for url in "https://codexa.creditvault.tech/login" "https://zzzzzzzzzzzzzzzzzzzzzzzz-preview.creditvault.tech/" "https://${TOKEN}-preview.creditvault.tech/"; do
            echo "=================== $url"
            curl -sS -m 60 -D - -H "accept: text/html" "$url" -o body.txt || true
            sed -e 's/<style>.*<\/style>//' body.txt | head -c 1500; echo
          done
