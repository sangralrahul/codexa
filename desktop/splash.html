<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <title>Codexa</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf7; --fg: #0b0c0f; --muted: #6b6f76; --track: #e7e5df; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #8a8a8a; --track: #222; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
      main { display: flex; flex-direction: column; align-items: center; animation: in 380ms cubic-bezier(.2,.7,.2,1) both; }
      img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 20px 40px -18px rgba(0,0,0,.45); }
      .word { margin-top: 18px; font-size: 26px; font-weight: 700; letter-spacing: -0.035em; }
      .bar { position: relative; width: 140px; height: 2px; margin-top: 22px; overflow: hidden; border-radius: 2px; background: var(--track); }
      .bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: var(--fg); animation: slide 1.1s ease-in-out infinite; }
      small { margin-top: 12px; color: var(--muted); }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } }
      @media (prefers-reduced-motion: reduce) { main, .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="build/icon.png" alt="" />
      <div class="word">codexa</div>
      <div class="bar" role="progressbar" aria-label="Loading"></div>
      <small>Opening your workspace…</small>
    </main>
  </body>
</html>
