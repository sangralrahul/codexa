<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
    <title>Codexa · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf7; --fg: #0b0c0f; --muted: #6b6f76; --border: #e4e2dc; --signal: #f0512a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #08090b; --fg: #f4f4f5; --muted: #9a9ca3; --border: #26282d; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; color: var(--muted); }
      button { height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
      small { display: block; margin-top: 16px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img src="build/icon.png" alt="" />
      <h1>You're offline</h1>
      <p>Codexa needs an internet connection. Check your connection and try again.</p>
      <button id="retry" type="button">Try again</button>
      <small id="note">Retrying automatically every 10 seconds.</small>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get("url") || "https://codexa.creditvault.tech";
      const go = () => { location.href = target; };
      document.getElementById("retry").addEventListener("click", go);
      window.addEventListener("online", go);
      setInterval(() => { if (navigator.onLine) go(); }, 10000);
    </script>
  </body>
</html>
